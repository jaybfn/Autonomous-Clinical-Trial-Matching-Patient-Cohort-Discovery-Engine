# Placeholder Ingress for Phase 11 FastAPI Service.
# Requires: cluster reachability + Service `trialmatch-api` in namespace trialmatch.
# Static IP name must match terraform output `ingress_static_ip_name`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trialmatch-api
  namespace: trialmatch
  annotations:
    kubernetes.kubernetes.io/ingress.global-static-ip-name: trialmatch-ingress-ip
    kubernetes.kubernetes.io/ingress.class: "gce"
  labels:
    app.kubernetes.io/name: trialmatch
spec:
  defaultBackend:
    service:
      name: trialmatch-api
      port:
        number: 80
