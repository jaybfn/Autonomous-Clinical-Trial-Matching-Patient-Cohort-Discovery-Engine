apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: trialmatch
  labels:
    app.kubernetes.io/name: qdrant
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
