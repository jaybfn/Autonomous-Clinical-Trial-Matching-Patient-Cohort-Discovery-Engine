apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: trialmatch
  labels:
    app.kubernetes.io/name: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.6.5
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            # Small open model that fits e2-standard-2 (~8Gi) with API + Qdrant.
            - name: OLLAMA_MODEL
              value: llama3.2:1b
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              ollama serve &
              pid=$!
              # Wait until the API is up, then ensure the model is pulled once.
              for i in $(seq 1 60); do
                if ollama list >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done
              ollama pull "${OLLAMA_MODEL}"
              wait "${pid}"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: ollama-data
          emptyDir:
            sizeLimit: 8Gi
